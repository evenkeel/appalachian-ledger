<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Appalachian Bitcoin</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #070E13; color: #C9D6DE;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        -webkit-user-select: none; user-select: none; cursor: default; }
      svg { width: 72px; height: 72px; }
      h1 { margin: 6px 0 0; font: 500 22px/1.2 Georgia, "Times New Roman", serif; color: #E7EEF2; letter-spacing: .01em; }
      p { margin: 0; color: #8DA3B1; }
      .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
      @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
      #problem { display: none; max-width: 30em; text-align: center; }
      #problem p { color: #C9D6DE; margin-bottom: 8px; }
      code { font: 12px ui-monospace, Menlo, monospace; color: #8DA3B1; word-break: break-all; -webkit-user-select: text; user-select: text; }
    </style>
  </head>

      <h1>Appalachian Bitcoin</h1>
      <p id="status" class="dots">Opening your ledger</p>
      <div id="problem">
        <p id="reason"></p>
        <code id="detail"></code>
      </div>
    </main>
    <script>
      // The app window calls this if the engine cannot start.
      window.showProblem = (reason, detail) => {
        document.getElementById("status").style.display = "none";
        document.getElementById("reason").textContent = reason;
        document.getElementById("detail").textContent = detail;
        document.getElementById("problem").style.display = "block";
      };
    </script>
