name: Mac app
# Builds the Mac app on GitHub's macOS machines, so it runs on more Macs than a build made
# on the newest macOS. A version tag (v0.1.0-beta.1, ...) also publishes it as a pre-release.
on:
  workflow_dispatch:
  pull_request:
    paths: ['desktop/**', 'backend/**', 'frontend/**', '.github/workflows/desktop.yml']
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: frontend
      - name: Build the app and the .dmg
        working-directory: desktop
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm ci && npm run build
      - name: Oldest macOS it runs on
        run: |
          app="desktop/src-tauri/target/release/bundle/macos/Appalachian Bitcoin.app/Contents"
          for f in "$app/MacOS/appalachian-bitcoin" "$app/Resources/engine/_internal/Python" "$app/Resources/engine/_internal/libssl.3.dylib"; do
            [ -e "$f" ] && echo "$(basename "$f"): $(otool -l "$f" | grep -A3 LC_BUILD_VERSION | grep minos | head -1)"
          done
      - name: The bundled engine starts and fetches a live price over HTTPS
        run: |
          engine="$PWD/desktop/src-tauri/target/release/bundle/macos/Appalachian Bitcoin.app/Contents/Resources/engine/ledger-engine"
          B=http://127.0.0.1:47899 J="$RUNNER_TEMP/jar"
          (sleep 120 | DEMO_ENABLED=true "$engine" --port 47899 --data-dir "$RUNNER_TEMP/ledger" &)
          for i in $(seq 1 60); do curl -sf $B/api/health && break; sleep 0.5; done
          curl -sf $B/ > /dev/null
          csrf=$(curl -sf -c "$J" -H "Origin: $B" -H 'Content-Type: application/json' \
            -d '{"username":"smoke","password":"x"}' $B/api/auth/setup | python3 -c "import json,sys; print(json.load(sys.stdin)['csrf'])")
          curl -sf -b "$J" -H "Origin: $B" -H "X-CSRF-Token: $csrf" -X POST $B/api/demo
          for i in $(seq 1 40); do
            curl -sf -b "$J" $B/api/prices/status | python3 -c "import json,sys; sys.exit(0 if json.load(sys.stdin)['quote'] else 1)" && { echo "live price ok"; exit 0; }
            sleep 2
          done
          cat "$RUNNER_TEMP/ledger/engine.log" 2>/dev/null; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
      - name: Publish a pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          cp "$dmg" Appalachian-Bitcoin-mac.dmg
          gh release create "$GITHUB_REF_NAME" Appalachian-Bitcoin-mac.dmg --prerelease \
            --title "Appalachian Bitcoin $GITHUB_REF_NAME (Mac beta)" \
            --notes "Beta for Macs with Apple silicon (M1 or newer). Not yet signed: the first time you open it, go to System Settings → Privacy & Security and click Open Anyway."
